spring.application.name=mobile

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/mobilecare
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/mobilecare
spring.datasource.username=root
spring.datasource.password=mobilecare
#spring.datasource.password=mobilecare
spring.datasource.datebase_name=mobilecare
spring.datasource.backuplocation=C://Backups/backup.sql
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.generate-ddl=true

# Hibernate Configuration (JPA)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
management.endpoints.web.exposure.include=*
server.port=8011
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.show_sql=true
current.date=#{T(java.time.LocalDate).now()}

#camunda.bpm.deployment-resource-pattern=classpath*:**/*.bpmn,classpath*:**/*.form
logging.level.org.camunda.bpm.spring.boot=DEBUG



management.endpoint.health.show-details=always